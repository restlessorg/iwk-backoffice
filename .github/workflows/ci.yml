name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: iwk
          POSTGRES_USER: iwk
          POSTGRES_PASSWORD: iwk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iwk -d iwk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PG_HOST: localhost
      PG_PORT: 5432
      PG_DB: iwk
      PG_DBUSER: iwk
      PG_DBPASS: iwk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy
      cancel-in-progress: false

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
