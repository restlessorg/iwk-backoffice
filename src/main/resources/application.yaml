spring:
  application:
    name: iwk-backoffice

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB}
    username: ${PG_DBUSER}
    password: ${PG_DBPASS}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}