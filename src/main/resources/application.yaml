spring:
  application:
    name: iwk-backoffice

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB}
    username: ${PG_DBUSER}
    password: ${PG_DBPASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: true
    locations: classpath:db/migration
