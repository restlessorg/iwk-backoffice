spring:
  application:
    name: iwk-backoffice

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB}?sslmode=require&channelBinding=require
    username: ${PG_DBUSER}
    password: ${PG_DBPASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      enabled: true
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db

    info:
      enabled: true

  health:
    defaults:
      enabled: true
    db:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  info:
    env:
      enabled: false
    java:
      enabled: true
    os:
      enabled: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}